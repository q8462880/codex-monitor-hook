# 可直接追加到 Codex config.toml。
# 这是人工参考片段，不要原样复制到另一台机器。
# 默认只保留额度刷新所需的 SessionStart 和 UserPromptSubmit。
# 安装脚本会按当前用户的 Python 和 ~/.codex_screen 路径生成绝对路径。
# Windows 必须使用 pythonw.exe，避免 Hook 启动时弹出控制台窗口。

# BEGIN codex-monitor-hook

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = '"C:\Path\to\pythonw.exe" "C:\Users\YourName\.codex_screen\codex_hook_relay.py"'
commandWindows = "& 'C:\\Path\\to\\pythonw.exe' 'C:\\Users\\YourName\\.codex_screen\\codex_hook_relay.py'"
timeout = 5

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = '"C:\Path\to\pythonw.exe" "C:\Users\YourName\.codex_screen\codex_hook_relay.py"'
commandWindows = "& 'C:\\Path\\to\\pythonw.exe' 'C:\\Users\\YourName\\.codex_screen\\codex_hook_relay.py'"
timeout = 5

# END codex-monitor-hook
