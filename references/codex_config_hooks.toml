# 可直接追加到 Codex config.toml。
# 这是人工参考片段，不要原样复制到另一台机器。
# Windows 的启动器和 pythonw 路径应由 scripts/install.ps1 按当前用户和当前 Python 安装位置生成。

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "python3 ~/.codex_screen/codex_hook_relay.py"
commandWindows = '& "C:\Users\42194\.codex_screen\codex_hook_windows_launcher.ps1" -Pythonw "pythonw" -Relay "C:\Users\42194\.codex_screen\codex_hook_relay.py"'
timeout = 5

