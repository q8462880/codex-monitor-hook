# 可直接追加到 Codex config.toml。
# 这是人工参考片段，不要原样复制到另一台机器。
# Windows 的启动器和 relay exe 路径应由 scripts/install.ps1 按当前用户路径生成。

# BEGIN codex-monitor-hook

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "~/.codex_screen/codex_hook_relay"
commandWindows = '& "C:\Users\42194\.codex_screen\codex_hook_windows_launcher.ps1" -RelayExe "C:\Users\42194\.codex_screen\codex_hook_relay.exe"'
timeout = 5

